<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background-color: black;color: aliceblue;">
    <div class="parent">
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thrusday</div>
        <div class="day">Friday</div> 
    </div>
</body>
<script>
   const parent = document.querySelector('.parent');
   console.log(parent); //gives all the parent 
   console.log(parent.children); // gives all the children 
   console.log(parent.children[1]); // gives all the children selected 
   console.log(parent.children[1].innerHTML); // gives the html writen 
   
   for (let i = 0; i < parent.children.length; i++) {
    console.log(parent.children[i].innerHTML);
   }
   parent.children[1].style.color = "orange"
   console.log(parent.firstElementChild);
   console.log(parent.lastElementChild);
   
   const day1 = document.querySelector('.day')
   console.log(day1);
   console.log(day1.parentElement);
   console.log(day1.nextElementSibling);
   
      console.log("NODES: ",parent.childNodes); //complex tree structure
      
      
   
   
   
</script>
</html>
